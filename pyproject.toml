[project]
name = "singing-coach"
version = "0.1.0"
description = "Personal AI voice coach. Record an exercise, get measurement-backed feedback from Claude."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Anthony Boyd", email = "anthony.n.boyd@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "librosa>=0.10",
    "torch==2.12.0",
    "torchaudio==2.11.0",
    "torchcrepe>=0.0.23",
    "praat-parselmouth>=0.4.4",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "gradio>=4.44",
    "matplotlib>=3.8",
    "pydantic>=2.7",
    "supabase>=2.31.0",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# CPU-only torch everywhere: this app never uses a GPU, and the default PyPI
# wheels drag ~4 GB of CUDA libraries into every install - which is also what
# blew Vercel's 5 GB function limit before this pin.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
singing-coach = "singing_coach.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/singing_coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
