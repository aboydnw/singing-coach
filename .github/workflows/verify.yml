name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn verify

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.90.0
      - run: node scripts/check-migrations.mjs
      - name: Start Supabase (retry registry rate limits)
        run: |
          for attempt in 1 2 3 4; do
            supabase start && exit 0
            echo "supabase start failed (attempt $attempt), retrying"
            supabase stop --no-backup || true
            sleep $((attempt * 30))
          done
          exit 1
      - run: supabase db reset --local --no-seed
      - run: supabase db lint --local --fail-on error
      - run: supabase test db supabase/tests/database --local
